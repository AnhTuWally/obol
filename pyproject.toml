[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obol"
version = "0.1.0"
description = "Personal media production pipeline and multi-project file manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
]

[project.scripts]
obol = "obol.cli.main:main"

[tool.setuptools.package-data]
"obol.gui" = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]
